<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minat Teknologi Mahasiswa</title>
</head>
<body>

    <h2>MINAT TEKNOLOGI MAHASISWA</h2>

    <form>

        <label for="nama">Nama</label><br>
        <input type="text" id="nama" name="nama" required>
        <br><br>

        <label>Pilih Minat:</label><br>

        <input type="checkbox" id="web" name="minat" value="Web Development">
        <label for="web">Web Development</label>
        <br>

        <input type="checkbox" id="ai" name="minat" value="Artificial Intelligence">
        <label for="ai">Artificial Intelligence</label>
        <br>

        <input type="checkbox" id="mobile" name="minat" value="Mobile Development">
        <label for="mobile">Mobile Development</label>
        <br>

        <input type="checkbox" id="game" name="minat" value="Game Development">
        <label for="game">Game Development</label>
        <br>

        <input type="checkbox" id="cyber" name="minat" value="Cyber Security">
        <label for="cyber">Cyber Security</label>
        <br><br>

        <input type="submit" value="SIMPAN">

    </form>

</body>
</html>
